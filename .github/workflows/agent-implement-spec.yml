name: Agent — Implement A Spec

# ═══════════════════════════════════════════════════════════════════════════
# THE WHOLE FACTORY, IN ONE ORCHESTRATOR
#
# Takes a spec issue, turns it into a queue of ordered child tickets
# (LOOP ONE: decompose), then works the frontier ticket one at a time
# (LOOP TWO: implement -> draft PR -> agent:review -> chain) until drained.
# The issues on GitHub are the queue and the program counter.
#
# Split across three files under .github/workflows/ (all protected by the
# Workflows permission) to stay under the 5,000-token file limit:
#   agent-implement-spec.yml            — triggers, survey, and chain
#   agent-implement-spec-decompose.yml  — reusable decompose job
#   agent-implement-spec-implement.yml  — reusable implement job
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. Both agents live
#     in .sandcastle/agent-workflows/implement-spec/. The provider and model
#     live in one place: .sandcastle/agent-workflows/shared/common.ts
#     (overridable via AGENT_PROVIDER and AGENT_MODEL env vars). Every script
#     writes them to $OUTPUT_DIR/agent.json for the trailer and marker steps.
#   Two `main`-only environments, each holding vars.APP_CLIENT_ID and
#     secrets.APP_PRIVATE_KEY:
#       decompose — xb-agent-decomposer (Issues: read/write), used by `survey`
#                   and `decompose`.
#       implement — xb-agent-builder (Contents, Pull requests, Issues, Actions:
#                   read/write), used by `implement` and `chain`.
#   Each job mints one token as its first step, narrowed with `permission-*`,
#     and stays under a 60-minute timeout so the token outlives the job. No
#     agent step receives a token. Because the agents and install/seed scripts
#     run unsandboxed as the same user, the runner holds job secrets in memory
#     and the post-step revokes the token with the key; only splitting the
#     agent into a secret-free job closes that. Real defence: collaborator-only
#     issues, comments and labels, plus `main`-only environments and no
#     Workflows permission on any app.
#   Screenshots stay in `decompose-evidence` / `implement-evidence` artifacts
#     (`gh --attach` rejects GitHub App installation tokens).
#   secrets.GITHUB_TOKEN — checkout only (`contents: read`).
#   The `agent:implement-spec` label (create once if missing).
# ═══════════════════════════════════════════════════════════════════════════

on:
  issues:
    types: [labeled]

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      spec_issue:
        description: "The spec issue number to work. Leave blank to pick up whichever spec is labelled agent:implement-spec."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name != 'issues' || github.event.label.name == 'agent:implement-spec') && 'agent-implement-spec' || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  survey:
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'agent:implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: decompose

    outputs:
      mode: ${{ steps.survey.outputs.mode }}
      spec: ${{ steps.survey.outputs.spec }}
      ticket: ${{ steps.survey.outputs.ticket }}
      remaining: ${{ steps.survey.outputs.remaining }}

    env:
      GH_REPO: ${{ github.repository }}
      REQUESTED_SPEC: ${{ github.event.issue.number || inputs.spec_issue }}

    steps:
      - name: Mint the decomposer token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: read

      - name: Find the spec and the frontier ticket
        id: survey
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          spec="${REQUESTED_SPEC:-}"
          if [ -z "$spec" ]; then
            spec=$(gh issue list --state open --label "agent:implement-spec" \
              --limit 1 --json number --jq '.[0].number // empty')
          fi
          if [ -z "$spec" ]; then
            echo "No spec is labelled agent:implement-spec. Nothing to do."
            echo "mode=no-spec" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Working spec #$spec"

          gh issue list --state all --label "spec:${spec}" --limit 100 \
            --json number,title,state,labels,body > /tmp/queue.json
          total=$(jq 'length' /tmp/queue.json)
          if [ "$total" -eq 0 ]; then
            echo "No queue for spec #$spec yet. This run decomposes it."
            echo "mode=decompose" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '
            [ .[]
              | { number,
                  state,
                  labels: [ .labels[].name ],
                  position: ((.body | capture("Position:\\s*(?<p>[0-9]+)").p // "999") | tonumber),
                  depends: ((.body | capture("Depends on:\\s*(?<d>[0-9, ]*)").d // "")
                             | split(",") | map(gsub("\\s";"")) | map(select(length>0) | tonumber)) }
            ] | sort_by(.position)
          ' /tmp/queue.json > /tmp/queue-sorted.json

          closed_positions=$(jq -c '[ .[] | select(.state=="CLOSED") | .position ]' /tmp/queue-sorted.json)

          ticket=$(jq -r --argjson closed "$closed_positions" '
            [ .[]
              | select(.state=="OPEN")
              | select(.labels | index("agent:blocked") | not)
              | select(all(.depends[]; . as $d | $closed | index($d) != null))
            ] | .[0].number // empty
          ' /tmp/queue-sorted.json)

          parked_count=$(jq '[ .[] | select(.state=="OPEN") | select(.labels | index("agent:blocked")) ] | length' /tmp/queue-sorted.json)
          open_count=$(jq '[ .[] | select(.state=="OPEN") | select(.labels | index("agent:blocked") | not) ] | length' /tmp/queue-sorted.json)
          echo "remaining=$open_count" >> "$GITHUB_OUTPUT"
          if [ "$parked_count" -gt 0 ]; then
            echo "::notice::Spec #$spec has $parked_count ticket(s) parked for a person. Take \`agent:blocked\` off one to put it back in the queue."
          fi

          if [ -z "$ticket" ]; then
            if [ "$open_count" -eq 0 ]; then
              echo "Queue for spec #$spec is drained."
              echo "mode=drained" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Spec #$spec has $open_count open tickets and none are unblocked."
              echo "mode=drained" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Frontier ticket: #$ticket ($open_count open)"
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          echo "mode=implement" >> "$GITHUB_OUTPUT"

  decompose:
    needs: survey
    if: needs.survey.outputs.mode == 'decompose'
    uses: ./.github/workflows/agent-implement-spec-decompose.yml
    with:
      spec: ${{ needs.survey.outputs.spec }}
    secrets: inherit

  implement:
    needs: survey
    if: needs.survey.outputs.mode == 'implement'
    uses: ./.github/workflows/agent-implement-spec-implement.yml
    with:
      spec: ${{ needs.survey.outputs.spec }}
      ticket: ${{ needs.survey.outputs.ticket }}
    secrets: inherit

  chain:
    needs: [survey, decompose, implement]
    if: |
      always() &&
      needs.survey.result == 'success' &&
      contains(fromJSON('["decompose", "implement"]'), needs.survey.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: implement

    steps:
      - name: Mint the builder token to start the next run
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-actions: write

      - name: Start the next ticket
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SPEC: ${{ needs.survey.outputs.spec }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Spec #${SPEC}: asking for the next ticket on ${REF}."
          gh workflow run agent-implement-spec.yml \
            --ref "$REF" \
            --field "spec_issue=${SPEC}"
