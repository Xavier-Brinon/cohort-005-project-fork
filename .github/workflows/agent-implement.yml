name: Agent — Implement A Ticket

# The first workflow in the software factory.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:implement` label on an issue. That is the whole
#   interface. No comment, no trigger phrase, no @mention — one label.
#
# WHAT IT DOES
#   Checks the repo out, gives an agent the ticket and the repo's verification
#   checks, adds Agent-Model/Agent-Role trailers, and opens a DRAFT PR with the
#   factory:model marker. Every run pushes to `agent/issue-<n>-<run id>` so
#   retries never collide. Agent: .sandcastle/agent-workflows/implement/implement.ts.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. The provider and
#     model live in one place: .sandcastle/agent-workflows/shared/common.ts
#     (model overridable via AGENT_MODEL). Resolved before the
#     agent runs; $OUTPUT_DIR/agent.json is cross-checked against it.
#   The `implement` environment: holds xb-agent-builder's vars.APP_CLIENT_ID
#     and secrets.APP_PRIVATE_KEY. Minted once as the first step (Contents,
#     Pull requests, Issues: write; no Workflows, so pushes cannot touch
#     .github/), never passed to the agent, and valid under the 45-minute
#     timeout. Each role's key lives in its own `main`-only environment.
#   secrets.GITHUB_TOKEN — checkout only (`contents: read`).
#   Screenshots stay in `implement-evidence` (`gh --attach` rejects app tokens).
#   The `agent:implement` label (create once if missing).
#
# WHERE THE TOKENS GO
#   GH_TOKEN is set only on steps that call GitHub; the checkout uses
#   `persist-credentials: false`. Because the agent and install/seed scripts
#   run unsandboxed as the same user, minting first keeps the key out of later
#   steps' env (except the action's post step, which revokes the token), though
#   the runner holds job secrets in memory and the job user has passwordless
#   sudo; only splitting the agent into a secret-free job closes that. A
#   leftover process could still read GH_TOKEN or alter .git/config. The real
#   defence is collaborator-only issues, comments and labels.
#
# WHO COMMITS
#   The agent commits through `.githooks/pre-commit`; every git command holding
#   a token switches hooks off with `core.hooksPath=/dev/null`.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` cannot come from a fork; never copy onto `pull_request_target`.

on:
  issues:
    types: [labeled]

# The permissions block. It is per-workflow, and it is a ceiling on the
# GITHUB_TOKEN — and the GITHUB_TOKEN now only checks the code out. Everything
# that writes goes through the builder app's tokens, whose ceiling is the
# app's own permissions, set in GitHub's settings and not here.
permissions:
  contents: read # the checkout

# One run per ticket. A second label event on the same issue waits for the
# first to finish rather than building the same ticket twice at once.
concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Every other label on every other issue stops here, for free.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: implement

    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # The run id makes the branch new on every run. See WHAT IT DOES.
      BRANCH: agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the builder token
        # The job's one token, before the checkout. See WHERE THE TOKENS GO for
        # why there is no second one after the agent.
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "name=${bot_name}"
            echo "email=${bot_id}+${bot_name}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Transition labels
        # The trigger comes off, so putting it back on is how you retry.
        # `agent:in-progress` goes on until the run ends, however it ends.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # A fresh clone of this repository does not have these labels yet.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up node and aube with mise
        # The versions come from mise.toml, the same pins as on your machine.
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: aube ci

      - name: Resolve configured model
        id: configured_model
        run: |
          set -euo pipefail
          model_id="$(node .sandcastle/agent-workflows/shared/common.ts | jq -r '"\(.provider)/\(.model)"')"
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid configured agent identity: $model_id"
            exit 1
          }
          echo "model_id=${model_id}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Migrate and seed the database
        # The agent gets a real database, because half of this repo's checks
        # need one. It is disposable: a fresh one, migrated and seeded, on
        # every run.
        run: |
          aube run db:migrate
          aube run db:seed

      - name: Open the branch
        id: branch
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git checkout -b "$BRANCH"
          # Where the agent starts. Anything after this is a commit it made.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The repo keeps its hooks in .githooks, and nothing installs them on a
          # fresh checkout. Point git at them, and fail if the pre-commit hook is
          # not there: the agent's commits would skip it without anyone noticing.
          git config core.hooksPath .githooks
          if [ ! -x .githooks/pre-commit ]; then
            echo "::error::The pre-commit hook is missing: .githooks/pre-commit does not exist or is not executable."
            exit 1
          fi

      - name: Read the ticket
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The comments an agent may read, from the REST API's pages. A comment
          # counts when its author has write access to this repo, or when it is the
          # explorer app's findings. REST names a bot `<app>[bot]`, a login no person
          # can take, so nobody can pose as the app. The factory's status lines carry
          # a hidden `<!-- factory:status -->` and are dropped.
          TRUSTED_COMMENTS: >-
            add // [] | map(select(
              ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
                or (.user.type == "Bot" and .user.login == "xb-agent-explorer[bot]"))
              and ((.body // "") | contains("<!-- factory:status -->") | not))
            | {author: {login: .user.login}, authorAssociation: .author_association,
               createdAt: .created_at, body})
        run: |
          set -euo pipefail
          # The same filter agent-explore.yml uses. Explore's findings pass:
          # they are what the implementer most needs to see, and they are
          # posted by xb-agent-explorer[bot], which the filter names. The
          # factory's status lines ("Building", "run failed") do not.
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels > /tmp/issue.json
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments" \
            | jq -s "$TRUSTED_COMMENTS" > /tmp/comments.json
          jq --slurpfile comments /tmp/comments.json '.comments = $comments[0]' \
            /tmp/issue.json > /tmp/ticket.json
          jq -r '
            "# " + .title + "\n\n" + .body
            + (if (.comments | length) > 0
               then "\n\n## Comments\n"
                 + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
               else "" end)
          ' /tmp/ticket.json > /tmp/ticket.md
          cat /tmp/ticket.md

      - name: Build the ticket
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: node .sandcastle/agent-workflows/implement/implement.ts

      - name: Check the agent committed
        # The agent owns the commits now, so this step owns the question of
        # whether there are any. No commit means no pull request, and the run
        # goes red rather than green-and-empty.
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --count "$BASE..HEAD")
          if [ "$commits" -eq 0 ]; then
            echo "::error::The agent finished without committing anything. Nothing to open a PR for."
            git status --short
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes. The PR would not contain them."
            git status --short
            exit 1
          fi
          git log --oneline "$BASE..HEAD"

      - name: Add model trailers
        env:
          BASE: ${{ steps.branch.outputs.base }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          AGENT_MODEL_ID: ${{ steps.configured_model.outputs.model_id }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/agent.json" ] || { echo "::error::Missing $RUNNER_TEMP/agent.json"; exit 1; }
          reported="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json")"
          if [ "$reported" != "$AGENT_MODEL_ID" ]; then
            echo "::error::agent.json reported ${reported}, expected ${AGENT_MODEL_ID}"
            exit 1
          fi

          old_head="$(git rev-parse HEAD)"
          declare -A mapped
          mapped["$BASE"]="$BASE"
          while IFS= read -r sha; do
            tree="$(git show -s --format=%T "$sha")"
            parent_args=()
            for p in $(git show -s --format=%P "$sha"); do
              parent_args+=(-p "${mapped[$p]:-$p}")
            done
            cleaned="$(git show -s --format=%B "$sha" | grep -viE '^[[:space:]]*Agent-(Model|Role)[[:space:]]*:' || true)"
            msg="$(printf '%s\n' "$cleaned" | git interpret-trailers --trailer "Agent-Model: ${AGENT_MODEL_ID}" --trailer "Agent-Role: builder")"
            new_sha="$(
              GIT_AUTHOR_NAME="$BOT_NAME" \
              GIT_AUTHOR_EMAIL="$BOT_EMAIL" \
              GIT_AUTHOR_DATE="$(git show -s --format=%aI "$sha")" \
              GIT_COMMITTER_NAME="$BOT_NAME" \
              GIT_COMMITTER_EMAIL="$BOT_EMAIL" \
              GIT_COMMITTER_DATE="$(git show -s --format=%cI "$sha")" \
              git -c core.hooksPath=/dev/null commit-tree "$tree" "${parent_args[@]}" <<< "$msg"
            )"
            mapped["$sha"]="$new_sha"
          done < <(git rev-list --reverse --topo-order "$BASE..$old_head")
          git -c core.hooksPath=/dev/null reset --hard "${mapped[$old_head]}"
          git log --format='%h %s | %(trailers:key=Agent-Model,valueonly=true) | %(trailers:key=Agent-Role,valueonly=true)' "$BASE..HEAD"

      - name: Push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The token exists for this one command. Hooks are off, so nothing
          # the agent wrote runs while it does.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Keep the screenshots
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: implement-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

      - name: Open the draft pull request
        id: pr
        env:
          # By default the built-in GITHUB_TOKEN is not allowed to open a
          # pull request, so this is the app's token. This step runs nothing
          # the agent wrote: it reads the agent's summary as text and hands it
          # to `gh`.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          AGENT_MODEL_ID: ${{ steps.configured_model.outputs.model_id }}
        run: |
          set -euo pipefail
          title="$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)"
          body_file=/tmp/pr-body.md
          [ -s "$body_file" ] || echo "Built by the implementer workflow." > "$body_file"
          perl -0777 -i -pe 's/<!--\s*factory:model\b[\s\S]*?-->//gi' "$body_file"

          # `gh --attach` rejects GitHub App installation tokens, even with
          # Contents write. Swap each `![alt](/tmp/evidence/<file>)` for the
          # file's name and link to the run's artifact.
          if grep -q '/tmp/evidence/' "$body_file"; then
            sed -E -i 's#!\[([^]]*)\]\(/tmp/evidence/([^)]*)\)#[screenshot \2: \1]#g' "$body_file"
            printf '\n\nScreenshots: [implement-evidence](%s)\n' "${EVIDENCE_URL:-$RUN_URL}" >> "$body_file"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${ISSUE_NUMBER}. Built unattended by [this run](${RUN_URL})."
            echo "Nobody has read this yet. That is what the draft state is for."
            echo ""
            echo "<!-- factory:model=${AGENT_MODEL_ID} role=builder run=${GITHUB_RUN_ID} -->"
          } >> "$body_file"

          url="$(gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file "$body_file")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      - name: Report back on the ticket
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
          AGENT_MODEL_ID: ${{ steps.configured_model.outputs.model_id || 'unknown/unknown' }}
        run: |
          where=""
          [ -n "$PR_URL" ] && where=" Pull request: ${PR_URL}, from \`${BRANCH}\`."
          retry=""
          [ "$JOB_STATUS" = "failure" ] && retry=" Re-add \`agent:implement\` to retry."
          # Tagged, so the next run on this ticket leaves it out of the ticket.
          gh issue comment "$ISSUE_NUMBER" --body \
            "Implementer run **${JOB_STATUS}** — [logs](${RUN_URL}).${where}${retry} <!-- factory:status --> <!-- factory:model=${AGENT_MODEL_ID} role=builder run=${GITHUB_RUN_ID} -->"

      - name: Always remove in-progress
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
