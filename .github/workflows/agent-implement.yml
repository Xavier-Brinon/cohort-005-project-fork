name: Agent — Implement A Ticket

# The first workflow in the software factory.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:implement` label on an issue. That is the whole
#   interface. No comment, no trigger phrase, no @mention — one label.
#
# WHAT IT DOES
#   Checks the repo out, gives an agent the ticket and the repo's own
#   verification checks, and opens a DRAFT pull request with whatever the
#   agent committed. Draft, always: the human checkpoint we removed from the
#   *build* has not been removed from the *merge*.
#
#   Every run pushes to a branch of its own, `agent/issue-<n>-<run id>`. A
#   retry never pushes onto the branch an earlier run left behind, so nothing
#   is there to reject the push and no run's work is lost. Two runs on one
#   ticket means two pull requests; close the one you do not want.
#
#   The agent itself is a Sandcastle script:
#   .sandcastle/agent-workflows/implement/implement.ts, with its prompt next
#   to it in prompt.md.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. To change the
#     agent or how it is billed, see
#     .sandcastle/agent-workflows/shared/common.ts.
#   The `implement` environment, named by the job. It holds the
#     xb-agent-builder app's client id (vars.APP_CLIENT_ID) and private key
#     (an environment secret). The key goes to the minting step and nowhere
#     else. Every step that talks to GitHub uses the token minted from them:
#     reading the ticket, pushing, opening the pull request, commenting. It
#     acts as xb-agent-builder[bot], lasts an hour at most, and is revoked
#     when the job ends.
#   The app has Contents, Pull requests, Issues and Actions: read and write.
#     It has no Workflows permission, so a push that touches .github/ is
#     refused: the agent cannot rewrite its own workflow. The job mints one
#     token, as its first step, narrowed with `permission-*` to Contents,
#     Pull requests and Issues. The job's 45-minute timeout keeps the run
#     inside the token's hour, so nothing has to mint again after the agent.
#   It cannot reach the other roles' keys. Each app's key sits in an
#     environment of its own, the job gets only the environment it names, and
#     every environment admits runs from `main` alone. Naming another one
#     takes a change merged to `main`, which this app cannot push.
#   secrets.GITHUB_TOKEN — supplied by Actions, and now used for one thing:
#     the checkout. The `permissions:` block below shrinks it to match.
#   The `agent:implement` label. A fresh clone of this repository does not
#     have it, and no workflow can create the label that starts it. Create it
#     once:
#       gh label create "agent:implement" --color 5319E7 \
#         --description "Hand this issue to the implementer agent"
#
# WHERE THE TOKENS GO
#   GH_TOKEN is set on the steps that call GitHub, never on the job. The
#   agent's step, and every step that runs code the agent wrote, has no
#   GitHub token in its environment. The checkout does not keep one either
#   (`persist-credentials: false`), so the only step that can push is the one
#   that hands git the token for that one command.
#
#   The token is minted once, before the checkout, and never after the
#   agent's step. The agent and the repo's install and seed scripts run
#   unsandboxed, as the same user as every later step, and a process they
#   leave running can read the environment of each step after it. A mint step
#   there would show it the private key, which mints tokens until someone
#   rotates it. Minted first, the key is in no later step's environment, with
#   one exception: the action's own post step, which revokes the token as the
#   job ends, is started with the key among its inputs.
#   Nor is the key gone from the machine. The runner keeps every secret the
#   job names in its own memory until the job ends, and the job's user has
#   passwordless sudo, so code that sets out to read that memory can. Only a
#   job that never names the key is safe from that, which means splitting the
#   agent from the job that pushes and posts.
#
#   That keeps the token out of the agent's way. It is not a wall: a leftover
#   process can still read GH_TOKEN from a later step, and `gh pr create`
#   runs git in a checkout whose .git/config the agent could write. That
#   token dies within the hour. The real defence is who can reach the agent at all: only
#   a collaborator can open an issue that gets read, only a collaborator's
#   comments get in, and the label is an approval only a collaborator can
#   give.
#
# WHO COMMITS
#   The agent does, and the repo's own pre-commit hook runs on every commit it
#   makes — the workflow points git at `.githooks` with `core.hooksPath`,
#   exactly as on your machine. When the hook rejects a commit, the agent reads
#   the failure, fixes its work and commits again. The hook is code from the
#   repo, so it runs only where there is no token: every git command that
#   holds one switches hooks off with `core.hooksPath=/dev/null`.
#
# A CAUTION THAT COMES WITH IT
#   `issues: labeled` fires on issues, which cannot come from a fork. Do not
#   copy this trigger onto `pull_request_target` — that runs fork code with
#   this job's secrets, and a fork can label nothing but can change the code
#   the agent runs.

on:
  issues:
    types: [labeled]

# The permissions block. It is per-workflow, and it is a ceiling on the
# GITHUB_TOKEN — and the GITHUB_TOKEN now only checks the code out. Everything
# that writes goes through the builder app's tokens, whose ceiling is the
# app's own permissions, set in GitHub's settings and not here.
permissions:
  contents: read # the checkout

# One run per ticket. A second label event on the same issue waits for the
# first to finish rather than building the same ticket twice at once.
concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Every other label on every other issue stops here, for free.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: implement

    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # The run id makes the branch new on every run. See WHAT IT DOES.
      BRANCH: agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the builder token
        # The job's one token, before the checkout. See WHERE THE TOKENS GO for
        # why there is no second one after the agent.
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Transition labels
        # The trigger comes off, so putting it back on is how you retry.
        # `agent:in-progress` goes on until the run ends, however it ends.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # A fresh clone of this repository does not have these labels yet.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up node and aube with mise
        # The versions come from mise.toml, the same pins as on your machine.
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: aube ci

      - name: Install Claude Code
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Migrate and seed the database
        # The agent gets a real database, because half of this repo's checks
        # need one. It is disposable: a fresh one, migrated and seeded, on
        # every run.
        run: |
          aube run db:migrate
          aube run db:seed

      - name: Open the branch
        id: branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Where the agent starts. Anything after this is a commit it made.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The repo keeps its hooks in .githooks, and nothing installs them on a
          # fresh checkout. Point git at them, and fail if the pre-commit hook is
          # not there: the agent's commits would skip it without anyone noticing.
          git config core.hooksPath .githooks
          if [ ! -x .githooks/pre-commit ]; then
            echo "::error::The pre-commit hook is missing: .githooks/pre-commit does not exist or is not executable."
            exit 1
          fi

      - name: Read the ticket
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The comments an agent may read, from the REST API's pages. A comment
          # counts when its author has write access to this repo, or when it is the
          # explorer app's findings. REST names a bot `<app>[bot]`, a login no person
          # can take, so nobody can pose as the app. The factory's status lines carry
          # a hidden `<!-- factory:status -->` and are dropped.
          TRUSTED_COMMENTS: >-
            add // [] | map(select(
              ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
                or (.user.type == "Bot" and .user.login == "xb-agent-explorer[bot]"))
              and ((.body // "") | contains("<!-- factory:status -->") | not))
            | {author: {login: .user.login}, authorAssociation: .author_association,
               createdAt: .created_at, body})
        run: |
          set -euo pipefail
          # The same filter agent-explore.yml uses. Explore's findings pass:
          # they are what the implementer most needs to see, and they are
          # posted by xb-agent-explorer[bot], which the filter names. The
          # factory's status lines ("Building", "run failed") do not.
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels > /tmp/issue.json
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments" \
            | jq -s "$TRUSTED_COMMENTS" > /tmp/comments.json
          jq --slurpfile comments /tmp/comments.json '.comments = $comments[0]' \
            /tmp/issue.json > /tmp/ticket.json
          jq -r '
            "# " + .title + "\n\n" + .body
            + (if (.comments | length) > 0
               then "\n\n## Comments\n"
                 + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
               else "" end)
          ' /tmp/ticket.json > /tmp/ticket.md
          cat /tmp/ticket.md

      - name: Build the ticket
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .sandcastle/agent-workflows/implement/implement.ts

      - name: Check the agent committed
        # The agent owns the commits now, so this step owns the question of
        # whether there are any. No commit means no pull request, and the run
        # goes red rather than green-and-empty.
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --count "$BASE..HEAD")
          if [ "$commits" -eq 0 ]; then
            echo "::error::The agent finished without committing anything. Nothing to open a PR for."
            git status --short
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes. The PR would not contain them."
            git status --short
            exit 1
          fi
          git log --oneline "$BASE..HEAD"

      - name: Push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The token exists for this one command. Hooks are off, so nothing
          # the agent wrote runs while it does.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Open the draft pull request
        id: pr
        env:
          # By default the built-in GITHUB_TOKEN is not allowed to open a
          # pull request, so this is the app's token. This step runs nothing
          # the agent wrote: it reads the agent's summary as text and hands it
          # to `gh`. `--attach` uploads the agent's screenshots and swaps
          # each matching /tmp/evidence path in the body for its URL. It needs
          # push access, which the builder app has and GITHUB_TOKEN lacks here.
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          title="$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)"
          body_file=/tmp/pr-body.md
          [ -s "$body_file" ] || echo "Built by the implementer workflow." > "$body_file"
          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${ISSUE_NUMBER}. Built unattended by [this run](${RUN_URL})."
            echo "Nobody has read this yet. That is what the draft state is for."
          } >> "$body_file"

          # nullglob: no screenshots means no --attach, and the PR still opens.
          shopt -s nullglob
          attach=()
          for png in /tmp/evidence/*.png; do attach+=(--attach "$png"); done

          url="$(gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file "$body_file" \
            "${attach[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      - name: Report back on the ticket
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          where=""
          [ -n "$PR_URL" ] && where=" Pull request: ${PR_URL}, from \`${BRANCH}\`."
          retry=""
          [ "$JOB_STATUS" = "failure" ] && retry=" Re-add \`agent:implement\` to retry."
          # Tagged, so the next run on this ticket leaves it out of the ticket.
          gh issue comment "$ISSUE_NUMBER" --body \
            "Implementer run **${JOB_STATUS}** — [logs](${RUN_URL}).${where}${retry} <!-- factory:status -->"

      - name: Always remove in-progress
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
