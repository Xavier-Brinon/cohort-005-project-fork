name: Agent — Explore The Tickets

# The third workflow in the software factory, and the one that runs first.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:explore` label on an issue. The run then ignores
#   which issue that was. It explores EVERY open issue labelled
#   `agent:explore`, together, as one batch.
#
# WHY A BATCH
#   Tickets arrive in clumps, and a clump has duplicates in it: the same bug
#   reported twice, three symptoms of one root cause. One run per ticket reads
#   the same code three times and never notices. One run over the batch reads
#   every ticket first, groups the ones that look related, explores each group
#   once with a subagent, and closes the duplicates onto the oldest ticket.
#
# WHAT IT DOES — AND, MORE IMPORTANTLY, WHAT IT DOES NOT
#   It reads. It reads the tickets and the code they would touch, and it hands
#   back a plan: one entry per ticket, with the comment to post on it. It does
#   not edit a file, open a branch or open a pull request.
#
#   It does not even post its own comments. There are two jobs:
#
#     explore   runs the agent. The agent holds no GitHub token at all.
#     apply     runs no agent. It checks the plan, and only then writes.
#
#   Read where the app token goes before you read anything else. It is the
#   enforcement, not the description. The prompt asks the agent to stay
#   read-only. In the explore job the token goes to one step, the one that
#   lists the batch, and that step runs before the agent exists and runs
#   nothing but `gh` and `jq`. The job's own GITHUB_TOKEN can read the code
#   and nothing else. So the agent has nothing to write with.
#
# WHY EXPLORE BEFORE YOU COMMIT
#   A ticket that looks like twenty minutes and is actually a schema change
#   costs the same to explore as one that really is twenty minutes. The cheap
#   run in front tells you which one you have, and it tells you in prose a
#   human can read in thirty seconds instead of a diff they have to review.
#
# AND THEN IT STOPS
#   The findings go on the issue as a comment, and the run ends there. You
#   read the comment and make the call: label `agent:implement` to build it,
#   or leave it. A plan the workflow cannot use is refused whole: nothing is
#   written, the run goes red, and every issue in the batch is marked
#   `agent:blocked`.
#
# THE LABELS WHILE IT RUNS
#   When the batch is listed, each issue swaps `agent:explore` for
#   `agent:in-progress`. Apply takes `agent:in-progress` off once the issue
#   has its comment. If the run fails, the `finish` job marks every issue
#   still in progress `agent:blocked`; re-add `agent:explore` to retry.
#
# THE AGENT
#   A Sandcastle script: .sandcastle/agent-workflows/explore/explore.ts, with
#   its prompt next to it in prompt.md.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. The provider and
#     model live in one place: .sandcastle/agent-workflows/shared/common.ts
#     (overridable via AGENT_PROVIDER and AGENT_MODEL). Resolved before the
#     agent runs; $OUTPUT_DIR/agent.json is cross-checked against it.
#   The `explore` environment, named by every job here. It holds the
#     xb-agent-explorer app's client id (vars.APP_CLIENT_ID) and private key
#     (an environment secret). Each job mints one token from them, never
#     after the agent's step, and every call this workflow makes to GitHub
#     uses it: listing the batch, posting the findings, moving the labels,
#     closing duplicates. A token lasts an hour at most, is revoked when its
#     job ends, and acts as xb-agent-explorer[bot].
#   The key goes to the minting step, and to that action's post step, which
#     revokes the token as the job ends. In `explore` that post step runs
#     after the agent, unsandboxed and as the same user, so a process the
#     agent leaves running can read the key from its environment.
#     Nor is the key gone from the machine. The runner keeps every secret the
#     job names in its own memory until the job ends, and the job's user has
#     passwordless sudo, so code that sets out to read that memory can. Only a
#     job that never names the key is safe from that, which means splitting the
#     agent from the job that pushes and posts.
#   The app has Issues: read and write, and nothing else. Each job narrows its
#     token further with `permission-*`, but a job can never ask for more than
#     the app holds, so no token here can push, open a pull request or start a
#     workflow.
#   It cannot reach the other roles' keys. Each app's key sits in an
#     environment of its own, a job gets only the environment it names, and
#     every environment admits runs from `main` alone. Naming another one
#     takes a change merged to `main`.
#   Screenshots are not attached inline: `gh --attach` rejects GitHub App
#     installation tokens, even with Contents write. They stay in the run's
#     `explore-evidence` artifact, and the findings comment links to it.
#   secrets.GITHUB_TOKEN — supplied by Actions, and used only to check the
#     code out. Scoped per job below.
#   The `agent:explore` label. A fresh clone of this repository does not have
#     it, and no workflow can create the label that starts it. Create it once:
#       gh label create "agent:explore" --color 5319E7 \
#         --description "The factory explores this ticket"

on:
  issues:
    types: [labeled]

# One batch at a time, and never cancelled. A label that lands mid-run queues
# one more run behind this one, and that run lists the batch again when it
# starts. The issues this run took are `agent:in-progress` by then, so that
# batch is only what was labelled mid-run, and nothing is lost. Every other
# label gets a throwaway group of its own, so it can never bump that queued run.
concurrency:
  group: ${{ github.event.label.name == 'agent:explore' && 'agent-explore' || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  explore:
    if: github.event.label.name == 'agent:explore'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: explore

    permissions:
      contents: read # the checkout. The tickets are read with the app token.

    # The batch it was given, the plan it came back with, and the model that
    # produced it. The apply and finish jobs read them.
    outputs:
      batch: ${{ steps.batch.outputs.numbers }}
      plan: ${{ steps.plan.outputs.json }}
      evidence: ${{ steps.evidence.outputs.artifact-url }}
      model: ${{ steps.configured_model.outputs.model_id }}

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Mint the explorer token
        # Before the checkout, and the job's only one. See WHAT IT NEEDS.
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: List the batch
        id: batch
        env:
          # The token, before the agent exists. No step after this one gets it.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The comments an agent may read, from the REST API's pages. A comment
          # counts when its author has write access to this repo, or when it is the
          # explorer app's findings. REST names a bot `<app>[bot]`, a login no person
          # can take, so nobody can pose as the app. The factory's status lines carry
          # a hidden `<!-- factory:status -->` and are dropped.
          TRUSTED_COMMENTS: >-
            add // [] | map(select(
              ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
                or (.user.type == "Bot" and .user.login == "xb-agent-explorer[bot]"))
              and ((.body // "") | contains("<!-- factory:status -->") | not))
            | {author: {login: .user.login}, authorAssociation: .author_association,
               createdAt: .created_at, body})
        run: |
          set -euo pipefail
          # Labels often go on several at once. Let them all land.
          sleep 5

          # Titles and bodies are written by whoever opened the issue, so they
          # go straight into a file. They never pass through the shell or an
          # Actions expression. The agent reads the file, with the comments
          # TRUSTED_COMMENTS lets through.
          mkdir -p /tmp/explore
          gh issue list --state open --label "agent:explore" --limit 100 \
            --json number,title,body,createdAt > /tmp/explore/list.json
          for n in $(jq -r '.[].number' /tmp/explore/list.json); do
            gh api --paginate "repos/$GH_REPO/issues/$n/comments" \
              | jq -s "$TRUSTED_COMMENTS" \
              | jq -c --argjson n "$n" '{number: $n, comments: .}'
          done | jq -s '.' > /tmp/explore/comments.json
          jq --slurpfile found /tmp/explore/comments.json '
            map(.number as $n
              | .comments = ([$found[0][] | select(.number == $n) | .comments][0] // []))
          ' /tmp/explore/list.json > /tmp/explore/issues.json

          numbers="$(jq -c '[.[].number] | sort' /tmp/explore/issues.json)"
          echo "Batch: $numbers"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

          # The trigger comes off, so putting it back on is how you retry.
          # `agent:in-progress` stays on until apply moves the issue on.
          if [ "$numbers" != "[]" ]; then
            # A fresh clone of this repository does not have these labels yet.
            gh label create "agent:in-progress" --color FBCA04 \
              --description "An agent is working on this right now" || true
            gh label create "agent:blocked" --color B60205 \
              --description "An agent run failed here. Its comment says how to retry" || true
          fi
          for n in $(jq -r '.[]' <<< "$numbers"); do
            gh issue edit "$n" --remove-label "agent:explore" || true
            gh issue edit "$n" --remove-label "agent:blocked" || true
            gh issue edit "$n" --add-label "agent:in-progress"
          done

      - name: Set up node and aube with mise
        if: steps.batch.outputs.numbers != '[]'
        # The versions come from mise.toml, the same pins as on your machine.
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        if: steps.batch.outputs.numbers != '[]'
        run: aube ci

      - name: Resolve configured model
        id: configured_model
        if: steps.batch.outputs.numbers != '[]'
        run: |
          set -euo pipefail
          model_id="$(node .sandcastle/agent-workflows/shared/common.ts | jq -r '"\(.provider)/\(.model)"')"
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid configured agent identity: $model_id"
            exit 1
          }
          echo "model_id=${model_id}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.batch.outputs.numbers != '[]'
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Explore
        if: steps.batch.outputs.numbers != '[]'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        # The plan comes back as plan.json, shaped and validated by
        # .sandcastle/agent-workflows/explore/plan-schema.ts.
        run: node .sandcastle/agent-workflows/explore/explore.ts

      - name: Cross-check agent.json
        if: steps.batch.outputs.numbers != '[]'
        env:
          AGENT_MODEL_ID: ${{ steps.configured_model.outputs.model_id }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/agent.json" ] || { echo "::error::Missing $RUNNER_TEMP/agent.json"; exit 1; }
          reported="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json")"
          if [ "$reported" != "$AGENT_MODEL_ID" ]; then
            echo "::error::agent.json reported ${reported}, expected ${AGENT_MODEL_ID}"
            exit 1
          fi

      - name: Hand the plan to the apply job
        id: plan
        if: steps.batch.outputs.numbers != '[]'
        run: |
          set -euo pipefail
          echo "json=$(jq -c . "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Keep the screenshots
        id: evidence
        if: steps.batch.outputs.numbers != '[]'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explore-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

  apply:
    needs: explore
    if: needs.explore.outputs.batch != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment: explore

    # No checkout and no agent, so the GITHUB_TOKEN gets nothing. This job
    # writes with the explorer app's token, minted once the plan passes.
    permissions: {}

    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVIDENCE_URL: ${{ needs.explore.outputs.evidence }}
      AGENT_MODEL_ID: ${{ needs.explore.outputs.model }}

    steps:
      - name: Check the plan
        env:
          # Through env, never pasted into the script. A `${{ }}` inside
          # `run:` is text bash runs, and the plan was written by an agent
          # that has just read a pile of untrusted issues.
          BATCH: ${{ needs.explore.outputs.batch }}
          PLAN: ${{ needs.explore.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > /tmp/plan.json
          [ -s /tmp/plan.json ] || { echo "The explore run returned no plan." >&2; exit 1; }

          # Every rule, written as "what is wrong". An empty list means apply.
          jq -r --argjson batch "$BATCH" '
            .issues as $plan
            | [
                # Every issue in the batch, exactly once.
                (if ([$plan[].number] | sort) != $batch
                 then "The plan needs exactly one entry for each of \($batch)."
                 else empty end),

                # Something to post.
                ($plan[] | select((.comment // "") | test("\\S") | not)
                 | "#\(.number) has an empty comment."),

                # A duplicate points at an issue in this batch that survives.
                ($plan[] | select(.duplicate_of) | . as $dup
                 | select([$plan[] | select(.number == $dup.duplicate_of and (.duplicate_of | not))] == [])
                 | "#\(.number) is a duplicate of #\(.duplicate_of), which is not a surviving issue in this batch.")
              ]
            | .[]
          ' /tmp/plan.json > /tmp/problems.txt

          if [ -s /tmp/problems.txt ]; then
            echo "Refusing the plan. Nothing was written, and the finish job marks the batch agent:blocked." >&2
            cat /tmp/problems.txt >&2
            exit 1
          fi

      - name: Mint the explorer token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Apply the plan
        # The findings comments are NOT tagged `<!-- factory:status -->`.
        # They are the one thing the implementer most needs to read, and the
        # implement workflows let this app's comments through by name.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # Survivors first, so "closed as duplicate of #N" points at an issue
          # that already has its findings on it.
          for n in $(jq -r '.issues | sort_by([.duplicate_of != null, .number]) | .[].number' /tmp/plan.json); do
            entry="$(jq -c --argjson n "$n" '.issues[] | select(.number == $n)' /tmp/plan.json)"
            dup="$(jq -r '.duplicate_of // empty' <<< "$entry")"

            if [ -n "$dup" ]; then
              next="Closed as duplicate of #$dup."
            else
              next="Explored. Settle the open questions, then label \`agent:implement\` yourself."
            fi

            jq -r '.comment' <<< "$entry" > /tmp/comment.md
            perl -0777 -i -pe 's/<!--\s*factory:model\b[\s\S]*?-->//gi' /tmp/comment.md
            # `gh --attach` rejects GitHub App installation tokens. So each
            # `![alt](/tmp/evidence/<file>)` becomes the file's name, and the
            # comment links to the run's artifact that holds the file.
            if grep -q '/tmp/evidence/' /tmp/comment.md; then
              sed -E -i 's#!\[([^]]*)\]\(/tmp/evidence/([^)]*)\)#[screenshot \2: \1]#g' /tmp/comment.md
              printf '\n\nScreenshots: [explore-evidence](%s)\n' "${EVIDENCE_URL:-$RUN_URL}" >> /tmp/comment.md
            fi
            printf '\n\n---\n\n_%s_ [Logs](%s)\n\n<!-- factory:model=%s role=explorer run=%s -->\n' \
              "$next" "$RUN_URL" "$AGENT_MODEL_ID" "$GITHUB_RUN_ID" >> /tmp/comment.md
            gh issue comment "$n" --body-file /tmp/comment.md

            # `agent:in-progress` comes off: this issue is done, and the
            # finish job leaves it alone.
            gh issue edit "$n" --remove-label "agent:in-progress"
            if [ -n "$dup" ]; then
              gh api --method PATCH "repos/$GH_REPO/issues/$n" \
                -f state=closed -f state_reason=duplicate --silent
            fi
          done

  # The two jobs above are one run, so the run's end is here: the same two
  # label steps that close every other agent workflow, over the whole batch.
  finish:
    needs: [explore, apply]
    if: always() && needs.explore.outputs.batch != '' && needs.explore.outputs.batch != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment: explore

    # No checkout and no agent. It writes labels and comments with the
    # explorer app's token.
    permissions: {}

    env:
      GH_REPO: ${{ github.repository }}
      BATCH: ${{ needs.explore.outputs.batch }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENT_MODEL_ID: ${{ needs.explore.outputs.model || 'unknown/unknown' }}

    steps:
      - name: Mint the explorer token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Mark blocked on failure
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Only the issues apply did not get to. One it did is already moved on.
          for n in $(jq -r '.[]' <<< "$BATCH"); do
            gh issue view "$n" --json labels --jq '.labels[].name' \
              | grep -qx "agent:in-progress" || continue
            gh issue edit "$n" --add-label "agent:blocked" || true
            gh issue comment "$n" --body \
              "Explore run **failed** — [logs](${RUN_URL}). Re-add \`agent:explore\` to retry. <!-- factory:status --> <!-- factory:model=${AGENT_MODEL_ID} role=explorer run=${GITHUB_RUN_ID} -->"
          done

      - name: Always remove in-progress
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for n in $(jq -r '.[]' <<< "$BATCH"); do
            gh issue edit "$n" --remove-label "agent:in-progress" || true
          done
