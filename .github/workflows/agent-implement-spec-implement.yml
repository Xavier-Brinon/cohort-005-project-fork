name: Agent — Implement A Spec (Implement)

# Reusable implement loop called by agent-implement-spec.yml.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. The provider and
#     model live in .sandcastle/agent-workflows/shared/common.ts (overridable
#     via AGENT_PROVIDER and AGENT_MODEL env vars) and are written to
#     $OUTPUT_DIR/agent.json.
#   The `implement` environment (xb-agent-builder, Contents, Pull requests,
#     Issues, Actions: read/write, `main`-only). Inherited via `secrets: inherit`.

on:
  workflow_call:
    inputs:
      spec:
        required: true
        type: string
      ticket:
        required: true
        type: string

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: implement

    env:
      GH_REPO: ${{ github.repository }}
      SPEC: ${{ inputs.spec }}
      TICKET: ${{ inputs.ticket }}
      BRANCH: agent/spec-${{ inputs.spec }}-ticket-${{ inputs.ticket }}-${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the builder token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "name=${bot_name}"
            echo "email=${bot_id}+${bot_name}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up node and aube with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Resolve configured model
        id: configured_model
        run: |
          set -euo pipefail
          model_id="$(node .sandcastle/agent-workflows/shared/common.ts | jq -r '"\(.provider)/\(.model)"')"
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid configured agent identity: $model_id"
            exit 1
          }
          echo "model_id=${model_id}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: aube ci

      - name: Install Claude Code
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Migrate and seed the database
        run: |
          aube run db:migrate
          aube run db:seed

      - name: Claim the ticket
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AGENT_MODEL_ID: ${{ steps.configured_model.outputs.model_id }}
        run: |
          set -euo pipefail
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh issue edit "$TICKET" \
            --remove-label "agent:queued" \
            --add-label "agent:in-progress"
          gh issue comment "$TICKET" \
            --body "Building — [logs](${RUN_URL}). <!-- factory:status --> <!-- factory:model=${AGENT_MODEL_ID} role=builder run=${GITHUB_RUN_ID} -->"

      - name: Read the ticket and its spec
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TRUSTED_COMMENTS: >-
            add // [] | map(select(
              ((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
                or (.user.type == "Bot" and .user.login == "xb-agent-explorer[bot]"))
              and ((.body // "") | contains("<!-- factory:status -->") | not))
            | {author: {login: .user.login}, authorAssociation: .author_association,
               createdAt: .created_at, body})
        run: |
          set -euo pipefail
          gh issue view "$TICKET" --json number,title,body > /tmp/issue.json
          gh api --paginate "repos/$GH_REPO/issues/$TICKET/comments" \
            | jq -s "$TRUSTED_COMMENTS" > /tmp/comments.json
          jq --slurpfile comments /tmp/comments.json '.comments = $comments[0]' \
            /tmp/issue.json > /tmp/ticket.json
          jq -r '
            "# " + .title + "\n\n" + .body
            + (if (.comments | length) > 0
               then "\n\n## Comments\n"
                 + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
               else "" end)
          ' /tmp/ticket.json > /tmp/ticket.md
          gh issue view "$SPEC" --json number,title,body \
            --jq '"# Spec: " + .title + "\n\n" + .body' > /tmp/spec.md
          cat /tmp/ticket.md

      - name: Open the branch
        id: branch
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git checkout -b "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config core.hooksPath .githooks
          if [ ! -x .githooks/pre-commit ]; then
            echo "::error::The pre-commit hook is missing: .githooks/pre-commit does not exist or is not executable."
            exit 1
          fi

      - name: Build the ticket
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: node .sandcastle/agent-workflows/implement-spec/build.ts

      - name: Check the agent committed
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --count "$BASE..HEAD")
          if [ "$commits" -eq 0 ]; then
            echo "::error::The agent finished #${TICKET} without committing anything."
            git status --short
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes on #${TICKET}. The PR would not contain them."
            git status --short
            exit 1
          fi
          git log --oneline "$BASE..HEAD"

      - name: Add model trailers
        id: trailers
        env:
          BASE: ${{ steps.branch.outputs.base }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          model_id="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json")"
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid agent identity in agent.json: $model_id"
            exit 1
          }
          echo "model_id=${model_id}" >> "$GITHUB_OUTPUT"

          old_head="$(git rev-parse HEAD)"
          declare -A mapped
          mapped["$BASE"]="$BASE"
          while IFS= read -r sha; do
            tree="$(git show -s --format=%T "$sha")"
            parent_args=()
            for p in $(git show -s --format=%P "$sha"); do
              parent_args+=(-p "${mapped[$p]:-$p}")
            done
            cleaned="$(git show -s --format=%B "$sha" | grep -viE '^[[:space:]]*Agent-(Model|Role)[[:space:]]*:' || true)"
            msg="$(printf '%s\n' "$cleaned" | git interpret-trailers --trailer "Agent-Model: ${model_id}" --trailer "Agent-Role: builder")"
            new_sha="$(
              GIT_AUTHOR_NAME="$BOT_NAME" \
              GIT_AUTHOR_EMAIL="$BOT_EMAIL" \
              GIT_AUTHOR_DATE="$(git show -s --format=%aI "$sha")" \
              GIT_COMMITTER_NAME="$BOT_NAME" \
              GIT_COMMITTER_EMAIL="$BOT_EMAIL" \
              GIT_COMMITTER_DATE="$(git show -s --format=%cI "$sha")" \
              git -c core.hooksPath=/dev/null commit-tree "$tree" "${parent_args[@]}" <<< "$msg"
            )"
            mapped["$sha"]="$new_sha"
          done < <(git rev-list --reverse --topo-order "$BASE..$old_head")
          git -c core.hooksPath=/dev/null reset --hard "${mapped[$old_head]}"
          git log --format='%h %s | %(trailers:key=Agent-Model,valueonly=true) | %(trailers:key=Agent-Role,valueonly=true)' "$BASE..HEAD"

      - name: Push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Keep the screenshots
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: implement-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

      - name: Open the draft PR
        id: ship
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          AGENT_MODEL_ID: ${{ steps.trailers.outputs.model_id }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$TICKET" --json title --jq .title)
          [ -s /tmp/pr-body.md ] || echo "Built by the implement-spec chain." > /tmp/pr-body.md
          perl -0777 -i -pe 's/<!--\s*factory:model\b[\s\S]*?-->//gi' /tmp/pr-body.md

          if grep -q '/tmp/evidence/' /tmp/pr-body.md; then
            sed -E -i 's#!\[([^]]*)\]\(/tmp/evidence/([^)]*)\)#[screenshot \2: \1]#g' /tmp/pr-body.md
            printf '\n\nScreenshots: [implement-evidence](%s)\n' "${EVIDENCE_URL:-$RUN_URL}" >> /tmp/pr-body.md
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${TICKET}. Part of spec #${SPEC}."
            echo "Built unattended by [this run](${RUN_URL}); nobody has read it yet."
            echo ""
            echo "<!-- factory:model=${AGENT_MODEL_ID} role=builder run=${GITHUB_RUN_ID} -->"
          } >> /tmp/pr-body.md

          url="$(gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md)"

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "shipped=true" >> "$GITHUB_OUTPUT"

      - name: Hand the pull request to the reviewer
        if: steps.ship.outputs.shipped == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "agent:review" --color 5319E7 \
            --description "Ask the review workflow to read this pull request" || true
          gh pr edit "$BRANCH" --add-label "agent:review"

      - name: Close the ticket and move the queue on
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.ship.outputs.url }}
          AGENT_MODEL_ID: ${{ steps.trailers.outputs.model_id || steps.configured_model.outputs.model_id }}
        run: |
          set -euo pipefail
          model_id="${AGENT_MODEL_ID:-}"
          if [ -z "$model_id" ] && [ -s "$RUNNER_TEMP/agent.json" ]; then
            model_id="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json" 2>/dev/null || true)"
          fi
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || model_id="unknown/unknown"
          marker="<!-- factory:model=${model_id} role=builder run=${GITHUB_RUN_ID} -->"

          gh issue edit "$TICKET" --remove-label "agent:in-progress" || true

          if [ "${{ steps.ship.outputs.shipped }}" = "true" ]; then
            gh issue close "$TICKET" \
              --comment "Built and opened as a draft PR, ${PR_URL}, from \`${BRANCH}\` — [logs](${RUN_URL}). Closing so the queue moves on; the pull request is where the review happens. <!-- factory:status --> ${marker}"
          else
            gh label create "agent:blocked" --color B60205 \
              --description "An agent run failed here. Its comment says how to retry" || true
            gh issue edit "$TICKET" --add-label "agent:blocked"
            gh issue comment "$TICKET" \
              --body "The chain could not finish this one (**${{ job.status }}**) — [logs](${RUN_URL}). Left open and labelled for a person. The queue will skip past it. Take \`agent:blocked\` off to put it back in the queue. <!-- factory:status --> ${marker}"
          fi
