name: Agent — Review A Pull Request

# Reviews what the implementer built, memory-less by design.
#
# WHAT TRIGGERS IT
#   `agent:review` label -> agent-review-relay.yml dispatches this workflow on
#   `main` with the PR number (or dispatch manually from Actions). Why the hop:
#   the `review` environment admits runs from `main` only; a `pull_request` run
#   checks against `refs/pull/<n>/merge` and runs the PR branch's copy of its
#   workflow. Dispatching on `main` runs `main`'s copy beside the key.
#
# WHAT IT DOES
#   Cold checkout plus three primary sources (three-dot diff, CODING_STANDARDS.md,
#   and the issue closed by the PR). Agent: .sandcastle/agent-workflows/review/review.ts.
#   Commits fixes it can make (never force-pushed; if the branch moved, fixes go
#   to `<branch>-<run id>` as a draft PR and the original gets `agent:blocked`),
#   adds Agent-Model/Agent-Role trailers, posts verdict + inline review with the
#   factory:model marker, and marks the PR ready once a verdict lands.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token. The provider and
#     model live in one place: .sandcastle/agent-workflows/shared/common.ts
#     (overridable via AGENT_PROVIDER and AGENT_MODEL env vars). Every script
#     writes them to $OUTPUT_DIR/agent.json for the trailer and marker steps.
#   The `review` environment: holds xb-agent-reviewer's vars.APP_CLIENT_ID and
#     secrets.APP_PRIVATE_KEY. Minted once as the first step (Contents, Pull
#     requests, Issues: write; no Workflows, so pushes cannot touch .github/),
#     never passed to the agent step, and valid under the 30-minute timeout.
#   Security note: the agent and the PR's install/seed scripts run unsandboxed
#     as the same user. Minting first keeps the key out of later steps' env
#     (except the action's post step, which revokes the token), though the runner
#     holds job secrets in memory and the job user has passwordless sudo; only
#     splitting the agent into a secret-free job closes that. A leftover process
#     could still read GH_TOKEN from a later step or alter .git/config; the real
#     defence is collaborator-only triggers and refusing fork PRs before checkout.
#   Each role's key sits in its own `main`-only environment, unreachable here.
#   secrets.GITHUB_TOKEN — checkout only.
#   The `agent:review` label (create once if missing).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The number of the pull request to review."
        required: true
        type: number

run-name: Review PR #${{ inputs.pr }}

permissions:
  contents: read

concurrency:
  group: agent-review-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: review

    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the reviewer token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "name=${bot_name}"
            echo "email=${bot_id}+${bot_name}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Not a PR number: $PR_NUMBER"; exit 1; }
          gh pr view "$PR_NUMBER" \
            --json state,isCrossRepository,headRefName,headRefOid,baseRefName > /tmp/pr.json
          if [ "$(jq -r .isCrossRepository /tmp/pr.json)" != "false" ]; then
            echo "::error::#$PR_NUMBER comes from a fork. The review runs only on this repository's branches."
            exit 1
          fi
          if [ "$(jq -r .state /tmp/pr.json)" != "OPEN" ]; then
            echo "::error::#$PR_NUMBER is not open."
            exit 1
          fi
          {
            echo "BRANCH=$(jq -r .headRefName /tmp/pr.json)"
            echo "FALLBACK_BRANCH=$(jq -r .headRefName /tmp/pr.json)-$GITHUB_RUN_ID"
            echo "BASE_REF=$(jq -r .baseRefName /tmp/pr.json)"
            echo "HEAD_SHA=$(jq -r .headRefOid /tmp/pr.json)"
          } >> "$GITHUB_ENV"

      - name: Transition labels
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the three primary sources
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq .body > /tmp/pr-body.md
          issue=$(grep -oiE '(closes|fixes|resolves) #[0-9]+' /tmp/pr-body.md \
            | head -n1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json number,title,body \
              --jq '"# Ticket #" + (.number|tostring) + ": " + .title + "\n\n" + .body' \
              > /tmp/review-spec.md
          else
            echo "No spec available: this PR does not say which ticket it closes." \
              > /tmp/review-spec.md
          fi
          cat /tmp/review-spec.md

      - name: Set up node and aube with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: aube ci

      - name: Install Claude Code
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Migrate and seed the database
        run: |
          aube run db:migrate
          aube run db:seed

      - name: Open the branch
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git checkout -B "$BRANCH"
          git config core.hooksPath .githooks
          if [ ! -x .githooks/pre-commit ]; then
            echo "::error::The pre-commit hook is missing: .githooks/pre-commit does not exist or is not executable."
            exit 1
          fi

      - name: Review the pull request
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: node .sandcastle/agent-workflows/review/review.ts

      - name: Add model trailers
        id: trailers
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          model_id="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json")"
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid agent identity in agent.json: $model_id"
            exit 1
          }
          echo "model_id=${model_id}" >> "$GITHUB_OUTPUT"

          old_head="$(git rev-parse HEAD)"
          if [ "$old_head" = "$HEAD_SHA" ]; then
            echo "The review made no commits. No trailers to add."
            exit 0
          fi

          declare -A mapped
          mapped["$HEAD_SHA"]="$HEAD_SHA"
          while IFS= read -r sha; do
            tree="$(git show -s --format=%T "$sha")"
            parent_args=()
            for p in $(git show -s --format=%P "$sha"); do
              parent_args+=(-p "${mapped[$p]:-$p}")
            done
            cleaned="$(git show -s --format=%B "$sha" | grep -viE '^[[:space:]]*Agent-(Model|Role)[[:space:]]*:' || true)"
            msg="$(printf '%s\n' "$cleaned" | git interpret-trailers --trailer "Agent-Model: ${model_id}" --trailer "Agent-Role: reviewer")"
            new_sha="$(
              GIT_AUTHOR_NAME="$BOT_NAME" \
              GIT_AUTHOR_EMAIL="$BOT_EMAIL" \
              GIT_AUTHOR_DATE="$(git show -s --format=%aI "$sha")" \
              GIT_COMMITTER_NAME="$BOT_NAME" \
              GIT_COMMITTER_EMAIL="$BOT_EMAIL" \
              GIT_COMMITTER_DATE="$(git show -s --format=%cI "$sha")" \
              git -c core.hooksPath=/dev/null commit-tree "$tree" "${parent_args[@]}" <<< "$msg"
            )"
            mapped["$sha"]="$new_sha"
          done < <(git rev-list --reverse --topo-order "$HEAD_SHA..$old_head")
          git -c core.hooksPath=/dev/null reset --hard "${mapped[$old_head]}"
          if [ -s "$RUNNER_TEMP/review-comments.json" ]; then
            jq --arg sha "$(git rev-parse HEAD)" '.commit_id = $sha' \
              "$RUNNER_TEMP/review-comments.json" > /tmp/review-comments.tmp
            mv /tmp/review-comments.tmp "$RUNNER_TEMP/review-comments.json"
          fi
          git log --format='%h %s | %(trailers:key=Agent-Model,valueonly=true) | %(trailers:key=Agent-Role,valueonly=true)' "$HEAD_SHA..HEAD"

      - name: Push the review's fixes
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The review left uncommitted changes. Only its commits are pushed."
            git status --short
          fi
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "The review made no commits. Nothing to push."
            exit 0
          fi
          git log --oneline "$HEAD_SHA..HEAD"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          push_to() {
            git -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/$1"
          }
          if push_to "$BRANCH"; then
            exit 0
          fi
          echo "::warning::The push to $BRANCH was rejected. Pushing the fixes to $FALLBACK_BRANCH instead."
          push_to "$FALLBACK_BRANCH"
          echo "fallback=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for the rejected push
        id: fallback
        if: steps.push.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AGENT_MODEL_ID: ${{ steps.trailers.outputs.model_id }}
        run: |
          set -euo pipefail
          {
            echo "The \`agent:review\` run on #${PR_NUMBER} committed fixes on top of \`${BRANCH}\`,"
            echo "but \`${BRANCH}\` moved during the run and the push was rejected. These are those fixes,"
            echo "so they are not lost. Keep this PR or #${PR_NUMBER}, and close the other."
            echo ""
            echo "Built unattended by [this run](${RUN_URL})."
            echo ""
            echo "<!-- factory:model=${AGENT_MODEL_ID} role=reviewer run=${GITHUB_RUN_ID} -->"
          } > /tmp/review-fallback.md
          url="$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$FALLBACK_BRANCH" \
            --title "$(gh pr view "$PR_NUMBER" --json title --jq .title) (review run ${{ github.run_id }})" \
            --body-file /tmp/review-fallback.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Keep the screenshots
        id: evidence
        if: always() && steps.pr.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

      - name: Post the verdict on the pull request
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          FALLBACK: ${{ steps.push.outputs.fallback }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
          AGENT_MODEL_ID: ${{ steps.trailers.outputs.model_id }}
        run: |
          set -euo pipefail
          model_id="${AGENT_MODEL_ID:-}"
          if [ -z "$model_id" ] && [ -s "$RUNNER_TEMP/agent.json" ]; then
            model_id="$(jq -r '"\(.provider)/\(.model)"' "$RUNNER_TEMP/agent.json" 2>/dev/null || true)"
          fi
          [[ "$model_id" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || model_id="unknown/unknown"
          [ -s /tmp/review-verdict.md ] || \
            echo "The review run produced no verdict. See the logs. Re-add \`agent:review\` to retry." \
              > /tmp/review-verdict.md
          perl -0777 -i -pe 's/<!--\s*factory:model\b[\s\S]*?-->//gi' /tmp/review-verdict.md
          if [ "$FALLBACK" = "true" ]; then
            {
              echo ""
              echo "The push of this review's fixes to \`$BRANCH\` was **rejected**: the branch moved during this run. Nothing was force-pushed."
              echo "The fixes are on \`$FALLBACK_BRANCH\`${FALLBACK_URL:+, opened as ${FALLBACK_URL}}. Labelled \`agent:blocked\`: keep one of the two PRs."
            } >> /tmp/review-verdict.md
          fi
          if grep -q '/tmp/evidence/' /tmp/review-verdict.md; then
            sed -E -i 's#!\[([^]]*)\]\(/tmp/evidence/([^)]*)\)#[screenshot \2: \1]#g' /tmp/review-verdict.md
            printf '\n\nScreenshots: [review-evidence](%s)\n' "${EVIDENCE_URL:-$RUN_URL}" >> /tmp/review-verdict.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Reviewed by the review workflow — [logs](${RUN_URL}). This run"
            echo "saw the diff, the standards and the ticket, and nothing else."
            echo ""
            echo "<!-- factory:model=${model_id} role=reviewer run=${GITHUB_RUN_ID} -->"
          } >> /tmp/review-verdict.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/review-verdict.md

      - name: Post the inline comments
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.fallback.outputs.number || inputs.pr }}
          AGENT_MODEL_ID: ${{ steps.trailers.outputs.model_id }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/review-comments.json"
          if [ "$(jq '.comments | length' "$review")" -eq 0 ]; then
            echo "No inline comments: the review fixed or passed everything."
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const strip = (text) => String(text ?? "").replace(/<!--\s*factory:model\b[\s\S]*?-->/gi, "");
            const marker = `<!-- factory:model=${process.env.AGENT_MODEL_ID} role=reviewer run=${process.env.GITHUB_RUN_ID} -->`;
            data.body = `${strip(data.body).trimEnd()}\n\n${marker}`;
            data.comments = data.comments.map((comment) => ({ ...comment, body: strip(comment.body) }));
            fs.writeFileSync("/tmp/review-comments-clean.json", JSON.stringify(data));
          ' "$review"
          gh api --method POST "repos/$GH_REPO/pulls/$TARGET/reviews" \
            --input /tmp/review-comments-clean.json --silent

      - name: Mark the pull request ready
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if grep -q '## Standards:' /tmp/review-verdict.md; then
            gh pr ready "$PR_NUMBER"
          else
            echo "No verdict, so the PR stays a draft."
          fi

      - name: Mark blocked on failure or a rejected push
        if: (failure() || steps.push.outputs.fallback == 'true') && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true

      - name: Always remove in-progress
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
