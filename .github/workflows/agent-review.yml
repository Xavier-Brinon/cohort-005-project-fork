name: Agent — Review A Pull Request

# The second workflow in the software factory. It reviews what the first one
# built.
#
# WHAT TRIGGERS IT
#   Someone puts the `agent:review` label on a pull request. The label does
#   not start this file: agent-review-relay.yml sees it and dispatches this
#   workflow on `main` with the pull request's number. You can also start it
#   by hand from the Actions tab, with a number.
#
#   Why the hop: the reviewer's key sits in the `review` environment, which
#   admits runs from `main` only. A `pull_request` run is checked against
#   `refs/pull/<n>/merge`, and runs the PR branch's copy of its workflow, so
#   it could never get in, and opening the environment to it would let any
#   branch's workflow read the key. A dispatched run on `main` runs `main`'s
#   copy of this file, and nothing else ever runs beside the key.
#
# MEMORY-LESS BY DESIGN
#   Shares nothing with the implementer run — cold checkout plus three primary
#   sources it fetches itself:
#
#     1. the diff              — what actually changed
#     2. CODING_STANDARDS.md   — the rules, at the repo root
#     3. the originating issue — read from the ticket the PR closes, not the PR body
#
#   Do not pass build context here: a shared context inherits the implementer's
#   shortcuts. The agent is .sandcastle/agent-workflows/review/review.ts
#   (prompt.md hands it the repo's code-review skill).
#
# IT FIXES WHAT IT CAN
#   Fixes every finding it can as commits on the PR's branch and leaves the
#   rest as inline comments. Pushes are never forced: if the branch moved
#   during the run, fixes go to `<pr branch>-<run id>` as a draft PR and the
#   original PR gets `agent:blocked` so a person picks which to keep.
#
# HOW IT ENDS: THE PR GOES READY
#   Once a verdict is posted, the last step marks the PR ready for review (on
#   fail as well as pass). Ready is not approved; a human still merges.
#
# WHAT IT NEEDS
#   secrets.CLAUDE_CODE_OAUTH_TOKEN — the agent's auth token.
#   The `review` environment, named by the job. It holds the
#     xb-agent-reviewer app's client id (vars.APP_CLIENT_ID) and private key
#     (an environment secret). The key goes to the minting step and nowhere
#     else. Every step that calls GitHub uses the token minted from them; the
#     agent's step does not. A token acts as xb-agent-reviewer[bot], lasts an
#     hour at most, and is revoked when the job ends.
#   The app has Contents, Pull requests and Issues: read and write, and no
#     Workflows, so its push of the review's fixes cannot touch .github/. The
#     job mints one token with all three, as its first step, and every step
#     that calls GitHub uses it. The job's 30-minute timeout keeps the run
#     inside the token's hour.
#   Why one token, minted first: the agent, and the PR's install and seed
#     scripts, run unsandboxed and as the same user as every later step. A
#     process they leave running outlives its step and can read the
#     environment of each step after it. A mint step after the agent would
#     show that process the private key, which mints tokens until someone
#     rotates it. And the PR's code was written by the builder's agent, so
#     that would hand one role's key to another role's code. Minted before
#     any of that code runs, the key is in no later step's environment, with
#     one exception: the action's own post step, which revokes the token as
#     the job ends, is started with the key among its inputs.
#     Nor is the key gone from the machine. The runner keeps every secret the
#     job names in its own memory until the job ends, and the job's user has
#     passwordless sudo, so code that sets out to read that memory can. Only a
#     job that never names the key is safe from that, which means splitting the
#     agent from the job that pushes and posts.
#   Keeping the token out of the agent's environment is tidiness, not a wall:
#     a leftover process can read GH_TOKEN from a later step, and a later
#     step that runs git in the checkout reads a .git/config the agent could
#     write. That token dies within the hour. The real defence is who can reach the agent — same-repo
#     PRs only, and a label only a collaborator can apply.
#   It cannot reach the other roles' keys. Each app's key sits in an
#     environment of its own, the job gets only the environment it names, and
#     every environment admits runs from `main` alone.
#   secrets.GITHUB_TOKEN — supplied by Actions, used only for the checkout.
#   The `agent:review` label. A fresh clone of this repository does not have
#     it, and no workflow can create the label that starts it. Create it once:
#       gh label create "agent:review" --color 5319E7 \
#         --description "Ask the review workflow to read this pull request"
#
# A CAUTION THAT COMES WITH IT
#   This workflow will not review a fork PR. A dispatched run gets none of the
#   protection `pull_request` gives a fork, so the first step refuses any PR
#   whose head is in another repository, before the PR's code is checked out.
#   The relay cannot dispatch for a fork either: there its token is
#   read-only. That is the correct trade: reviewing a stranger's code with a
#   writable token is how a factory gets robbed.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The number of the pull request to review."
        required: true
        type: number

run-name: Review PR #${{ inputs.pr }}

# A ceiling on the GITHUB_TOKEN, which only checks the code out. Reading the
# PR and the ticket, pushing the fixes, posting the verdict and the inline
# comments, and marking the PR ready all go through the reviewer app's token.
permissions:
  contents: read # the checkout

# One review per PR, never cancelled: a cancelled review would lose the
# commits it made. A fresh `agent:review` waits for the one running. Only
# that label reaches this file: the relay drops every other one.
concurrency:
  group: agent-review-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: review

    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mint the reviewer token
        # The job's one token, before the PR's code is on the machine. See
        # WHAT IT NEEDS for why there is no second one after the agent.
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Find the pull request
        id: pr
        # A dispatch carries only a number, so the branch and the commit to
        # review come from GitHub. It refuses a fork's PR and a closed one
        # before anything is checked out. The later steps guard on this one,
        # so a refused PR gets no label and no comment.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Not a PR number: $PR_NUMBER"; exit 1; }
          gh pr view "$PR_NUMBER" \
            --json state,isCrossRepository,headRefName,headRefOid,baseRefName > /tmp/pr.json
          if [ "$(jq -r .isCrossRepository /tmp/pr.json)" != "false" ]; then
            echo "::error::#$PR_NUMBER comes from a fork. The review runs only on this repository's branches."
            exit 1
          fi
          if [ "$(jq -r .state /tmp/pr.json)" != "OPEN" ]; then
            echo "::error::#$PR_NUMBER is not open."
            exit 1
          fi
          # Branch names cannot hold a newline, so each is one line here.
          # FALLBACK_BRANCH is where the fixes go if the push to BRANCH is
          # rejected. New every run.
          {
            echo "BRANCH=$(jq -r .headRefName /tmp/pr.json)"
            echo "FALLBACK_BRANCH=$(jq -r .headRefName /tmp/pr.json)-$GITHUB_RUN_ID"
            echo "BASE_REF=$(jq -r .baseRefName /tmp/pr.json)"
            echo "HEAD_SHA=$(jq -r .headRefOid /tmp/pr.json)"
          } >> "$GITHUB_ENV"

      - name: Transition labels
        # The trigger comes off, so putting it back on is how you retry.
        # `agent:in-progress` goes on until the run ends, however it ends.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # A fresh clone of this repository does not have these labels yet.
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is working on this right now" || true
          gh label create "agent:blocked" --color B60205 \
            --description "An agent run failed here. Its comment says how to retry" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR's head, so the review's fixes are commits on top of it.
          # Full history: the review diffs it against the base.
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the three primary sources
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # 1. The diff: the agent takes it against `origin/$BASE_REF`, the
          #    base as it is now, three-dot, so anything pushed to the base
          #    since the PR opened is not blamed on the PR.
          # 2. The standards: CODING_STANDARDS.md, in the checkout.
          # 3. The spec. Whatever issue this PR closes — found in the PR body,
          #    which is the one thing here we do read from the PR. If there is
          #    no `Closes #n`, the Spec axis reports "no spec available"
          #    rather than inventing one.
          gh pr view "$PR_NUMBER" --json body --jq .body > /tmp/pr-body.md
          issue=$(grep -oiE '(closes|fixes|resolves) #[0-9]+' /tmp/pr-body.md \
            | head -n1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json number,title,body \
              --jq '"# Ticket #" + (.number|tostring) + ": " + .title + "\n\n" + .body' \
              > /tmp/review-spec.md
          else
            echo "No spec available: this PR does not say which ticket it closes." \
              > /tmp/review-spec.md
          fi
          cat /tmp/review-spec.md

      - name: Set up node and aube with mise
        # The versions come from mise.toml, the same pins as on your machine.
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: aube ci

      - name: Install Claude Code
        run: |
          aube add -g @anthropic-ai/claude-code
          aube bin -g >> "$GITHUB_PATH"

      - name: Migrate and seed the database
        # The pre-commit hook runs on every commit the agent makes, and the
        # repo's checks need a database.
        run: |
          aube run db:migrate
          aube run db:seed

      - name: Open the branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # The repo keeps its hooks in .githooks, and nothing installs them on a
          # fresh checkout. Point git at them, and fail if the pre-commit hook is
          # not there: the agent's commits would skip it without anyone noticing.
          git config core.hooksPath .githooks
          if [ ! -x .githooks/pre-commit ]; then
            echo "::error::The pre-commit hook is missing: .githooks/pre-commit does not exist or is not executable."
            exit 1
          fi

      - name: Review the pull request
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: node .sandcastle/agent-workflows/review/review.ts

      - name: Push the review's fixes
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The review left uncommitted changes. Only its commits are pushed."
            git status --short
          fi
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "The review made no commits. Nothing to push."
            exit 0
          fi
          git log --oneline "$HEAD_SHA..HEAD"
          # The token exists for these commands. Hooks are off, so nothing
          # the PR or the agent wrote runs while it does.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          push_to() {
            git -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/$1"
          }
          # Not a force push: if someone pushed to the branch during the run,
          # this is rejected.
          if push_to "$BRANCH"; then
            exit 0
          fi
          # Rejected. Never force it, and never lose the fixes: push them to a
          # branch of their own, which this run's id makes new.
          echo "::warning::The push to $BRANCH was rejected. Pushing the fixes to $FALLBACK_BRANCH instead."
          push_to "$FALLBACK_BRANCH"
          echo "fallback=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for the rejected push
        id: fallback
        if: steps.push.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          {
            echo "The \`agent:review\` run on #${PR_NUMBER} committed fixes on top of \`${BRANCH}\`,"
            echo "but \`${BRANCH}\` moved during the run and the push was rejected. These are those fixes,"
            echo "so they are not lost. Keep this PR or #${PR_NUMBER}, and close the other."
            echo ""
            echo "Built unattended by [this run](${RUN_URL})."
          } > /tmp/review-fallback.md
          url="$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$FALLBACK_BRANCH" \
            --title "$(gh pr view "$PR_NUMBER" --json title --jq .title) (review run ${{ github.run_id }})" \
            --body-file /tmp/review-fallback.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Keep the screenshots
        id: evidence
        if: always() && steps.pr.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-evidence
          path: /tmp/evidence/*.png
          if-no-files-found: ignore

      - name: Post the verdict on the pull request
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          FALLBACK: ${{ steps.push.outputs.fallback }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
        run: |
          set -euo pipefail
          [ -s /tmp/review-verdict.md ] || \
            echo "The review run produced no verdict. See the logs. Re-add \`agent:review\` to retry." \
              > /tmp/review-verdict.md
          if [ "$FALLBACK" = "true" ]; then
            {
              echo ""
              echo "The push of this review's fixes to \`$BRANCH\` was **rejected**: the branch moved during this run. Nothing was force-pushed."
              echo "The fixes are on \`$FALLBACK_BRANCH\`${FALLBACK_URL:+, opened as ${FALLBACK_URL}}. Labelled \`agent:blocked\`: keep one of the two PRs."
            } >> /tmp/review-verdict.md
          fi
          # `gh --attach` rejects GitHub App installation tokens, even with
          # Contents write. Swap each `![alt](/tmp/evidence/<file>)` for the
          # file's name and link to the run's artifact.
          if grep -q '/tmp/evidence/' /tmp/review-verdict.md; then
            sed -E -i 's#!\[([^]]*)\]\(/tmp/evidence/([^)]*)\)#[screenshot \2: \1]#g' /tmp/review-verdict.md
            printf '\n\nScreenshots: [review-evidence](%s)\n' "${EVIDENCE_URL:-$RUN_URL}" >> /tmp/review-verdict.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Reviewed by the review workflow — [logs](${RUN_URL}). This run"
            echo "saw the diff, the standards and the ticket, and nothing else."
          } >> /tmp/review-verdict.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/review-verdict.md

      - name: Post the inline comments
        # One review, event COMMENT, with a comment on each line the agent
        # left a finding on. They go where the fixes went: the fallback PR if
        # the push was rejected. review.ts already dropped every comment
        # outside the diff, because GitHub rejects the whole review for one.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.fallback.outputs.number || inputs.pr }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/review-comments.json"
          if [ "$(jq '.comments | length' "$review")" -eq 0 ]; then
            echo "No inline comments: the review fixed or passed everything."
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/pulls/$TARGET/reviews" \
            --input "$review" --silent

      - name: Mark the pull request ready
        # No `always()` here. If the agent broke, nobody has read the PR, so
        # it stays a draft. And it goes ready only when a real verdict was
        # posted: the fallback note above is not a review. The verdict's own
        # `## Standards:` heading is how we tell. Pass or fail does not
        # matter. This step runs nothing the agent or the PR wrote: it reads
        # the verdict as text and calls `gh`.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if grep -q '## Standards:' /tmp/review-verdict.md; then
            gh pr ready "$PR_NUMBER"
          else
            echo "No verdict, so the PR stays a draft."
          fi

      - name: Mark blocked on failure or a rejected push
        # A rejected push is blocked too: the fixes are on another branch, and
        # a person has to choose between the two PRs.
        if: (failure() || steps.push.outputs.fallback == 'true') && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true

      - name: Always remove in-progress
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
