# Dependencies whose install scripts may run. Anything not listed installs
# without its build step; `aube ignored-builds` lists what was skipped.
allowBuilds:
  better-sqlite3: true # native bindings; fails at runtime without its build
  esbuild: true
  fsevents: true
  msw: true
  protobufjs: false # postinstall only checks its own CLI's deps; not needed

# Exact versions exempt from the trust-downgrade check, each reviewed by hand.
trustPolicyExclude:
  # Backport on the 9.x line (2025-10-18), published without the trusted
  # publisher that 10.0.0 used. Pulled in by @knocklabs/agent-toolkit.
  - "pino@9.14.0"
